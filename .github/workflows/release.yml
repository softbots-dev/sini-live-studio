# Rilis Sini Live Studio (berlaku di repo publik softbots-dev/sini-live-studio). Tag v* → bangun installer
# Windows dari kode di repo ini (syarat GPL: installer = kode yang dipublikasikan) → GitHub Release.
# Tanda tangan kode: aktif sendiri bila rahasia WIN_CSC_LINK diisi; kosong = installer tanpa tanda tangan.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Biner Electron (Electron 43 tidak mengunduh saat npm ci)
        run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never
      # Satu langkah membuat rilis DAN mengunggah semua berkas. electron-builder --publish always mengunggah
      # paralel dan bisa membuat dua rilis bertag sama (latest.yml terpisah dari installer → pembaruan
      # otomatis tidak menemukannya).
      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME#v}" --generate-notes
          release/Sini-Live-Studio-Setup.exe release/Sini-Live-Studio-Setup.exe.blockmap release/latest.yml
